# JSON Schema for OpenCode YAML Plan Format
# Schema version 3: first fully-structured YAML plan format.
# Embedded in YAML for easy reading and tooling support.
---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://opencode.ai/skills/plan/schema.yaml
title: OpenCode Plan Schema
description: JSON Schema for structured YAML plan artifacts
type: object
required:
  - artifact_type
  - schema_version
  - id
  - title
  - status
  - created_at
  - updated_at
  - proposal
  - state_dir
  - active_step
  - objective
  - proposal_summary
  - inputs
  - constraints
  - execution_strategy
  - delegation_map
  - steps
  - dependency_graph
  - parallel_groups
  - state_initialization
  - verification_gates
  - embedded_quality_check
  - rollback_recovery
  - final_report_contract

properties:
  artifact_type:
    type: string
    const: plan
    description: Discriminator for plan artifacts
  schema_version:
    type: integer
    const: 3
    description: Version for migration tracking (3 for YAML format)
  id:
    type: string
    pattern: "^[0-9]+-[a-z0-9-]+$"
    description: Unique identifier for the plan (timestamp-slug format)
  title:
    type: string
    description: Human-readable title for the plan
  status:
    type: string
    enum:
      - draft
      - approved
      - executing
      - blocked
      - complete
      - superseded
    description: Current status of the plan
  created_at:
    type: string
    format: date-time
    description: ISO timestamp for when the plan was created
  updated_at:
    type: string
    format: date-time
    description: ISO timestamp for when the plan was last updated
  proposal:
    type: string
    pattern: "^\\.\\.\\/\\.proposals\\/[0-9]+-[a-z0-9-]+\\.md$"
    description: >
      Path to the accepted proposal artifact.
      Planning requires an accepted proposal. Direct-user-request planning is not supported.
  state_dir:
    type: string
    pattern: "^\\.\\.\\/\\.state\\/[0-9]+-[a-z0-9-]+\\/$"
    description: Path to the state directory for this plan
  active_step:
    type: ["string", "null"]
    pattern: "^(0[0-9]-[a-z0-9-]+$|null$)"
    description: Current execution step ID or null
  objective:
    type: string
    description: Clear statement of what this plan intends to accomplish
  proposal_summary:
    type: string
    description: Brief summary of the accepted proposal this plan implements

  handoff_traceability:
    type: object
    description: >
      Maps proposal acceptance criteria to plan verification gates and step acceptance criteria.
      This field is optional and experimental. The structure may evolve.
    additionalProperties: true
    properties: {}
  planning_analysis:
    type: object
    description: >
      Analysis record showing how steps were derived from the accepted proposal:
      problem breakdown, workstreams, skill/worker mapping, dependency/parallel analysis,
      state/artifact impact, delegation packet inventory.
      This field is optional and experimental. The structure may evolve.
    additionalProperties: true
    properties: {}

  inputs:
    type: array
    items:
      type: string
    description: List of input resources or file paths
  constraints:
    type: array
    items:
      type: string
    description: List of constraints affecting the plan execution
  execution_strategy:
    type: string
    description: High-level description of the execution approach
  delegation_map:
    type: object
    additionalProperties:
      type: string
      pattern: "^(generic|analysis|coding|doc-writer|websearch|multimodal-looker)-[a-z]+$"
    description: Maps workflow roles to worker family+size
  steps:
    type: array
    items:
      type: object
      required:
        - id
        - depends_on
        - parallel_group
        - worker
        - skill
        - minimum_capable_tier
        - context_package
        - objective
        - expected_output
        - state_updates
        - acceptance_criteria
        - verification
        - recovery
      properties:
        id:
          type: string
          pattern: "^0[0-9]-[a-z0-9-]+$"
          description: Unique step identifier (01-step-slug format)
        depends_on:
          type: array
          items:
            type: string
            pattern: "^0[0-9]-[a-z0-9-]+$"
          description: List of step IDs this step depends on
        parallel_group:
          type: string
          description: Parallel group identifier for concurrency control
        worker:
          type: object
          required:
            - family
            - size
          properties:
            family:
              type: string
              enum:
                - generic
                - analysis
                - coding
                - doc-writer
                - websearch
                - multimodal-looker
              description: Worker family type
            size:
              type: string
              enum:
                - xs
                - sm
                - md
                - lg
                - xl
              description: Worker size
        minimum_capable_tier:
          type: string
          enum:
            - xs
            - sm
            - md
            - lg
            - xl
          description: Minimum worker tier required for this step
        skill:
          type: ["string", "null"]
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          description: >
            Optional skill name to load for this step.
            Must be null (no skill) or a lowercase hyphenated skill name (e.g., "proposal", "lesson-writer").
            Runtime must verify the named skill exists before loading.
        context_package:
          type: object
          required:
            - user_requirement_slice
            - relevant_proposal_sections
            - relevant_state_files
            - files_in_scope
            - files_out_scope
            - expected_return_format
          properties:
            user_requirement_slice:
              type: string
              description: Slice of user requirements relevant to this step
            relevant_proposal_sections:
              type: array
              items:
                type: string
              description: Relevant sections from the proposal
            relevant_state_files:
              type: array
              items:
                type: string
              description: Relevant state files to read
            files_in_scope:
              type: array
              items:
                type: string
              description: Files this step may read or edit
            files_out_scope:
              type: array
              items:
                type: string
              description: Files this step must not touch
            expected_return_format:
              type: string
              description: Expected format of the output
        objective:
          type: string
          description: Bounded objective for this step
        expected_output:
          type: string
          description: What this step should produce
        state_updates:
          type: array
          items:
            type: string
          description: State files that will be updated by this step
        acceptance_criteria:
          type: array
          items:
            type: string
          description: Criteria for determining if this step succeeded
        verification:
          type: string
          description: How to verify this step
        recovery:
          type: string
          description: What to do if this step fails
      additionalProperties: false
    description: List of execution steps
  dependency_graph:
    type: object
    additionalProperties:
      type: array
      items:
        type: string
        pattern: "^0[0-9]-[a-z0-9-]+$"
    description: Step dependencies mapping step IDs to their dependencies
  parallel_groups:
    type: object
    additionalProperties:
      type: array
      items:
        type: string
        pattern: "^0[0-9]-[a-z0-9-]+$"
    description: Parallel groups mapping group identifiers to step IDs
  state_initialization:
    type: object
    required:
      - metadata_schema_version
      - require_step_files
      - step_file_extension
      - main_dashboard
    properties:
      metadata_schema_version:
        type: integer
        description: Version of the metadata schema
      require_step_files:
        type: boolean
        description: Whether step files are required
      step_file_extension:
        type: string
        description: Extension for step files
      main_dashboard:
        type: string
        description: Name of the main dashboard file
    additionalProperties: false
    description: Defines the expected .state/<plan_slug>/ structure for this plan
  verification_gates:
    type: array
    items:
      type: object
      required:
        - gate
        - criteria
      properties:
        gate:
          type: string
          description: Name of the verification gate
        criteria:
          type: array
          items:
            type: string
          description: List of criteria for this gate
      additionalProperties: false
    description: List of verification gates with their criteria
  embedded_quality_check:
    type: object
    required:
      - performed_by
      - findings
      - status
    properties:
      performed_by:
        type: ["string", "null"]
        description: Worker who performed the quality check
      findings:
        type: ["array", "null"]
        items:
          type: string
        description: Findings from the quality check
      status:
        type: string
        enum:
          - pending
          - passed
          - failed
        description: Status of the quality check
    additionalProperties: false
    description: Embedded quality check information
  rollback_recovery:
    type: string
    description: Steps to undo or recover from execution
  final_report_contract:
    type: string
    description: What the final report must include

additionalProperties: false
