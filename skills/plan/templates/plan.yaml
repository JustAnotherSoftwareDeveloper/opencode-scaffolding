---
# Template/Example for OpenCode YAML Plan Format (Schema Version 3)
# This is a generic example showing the structure and placeholder values.
# Replace all placeholder values with actual content when creating a new plan.
artifact_type: plan
schema_version: 3
id: "<unix-timestamp>-<plan-slug>"
title: "<Descriptive title for the plan>"
status: draft  # One of: draft, approved, executing, blocked, complete, superseded
created_at: "<ISO 8601 timestamp (e.g., 2026-05-13T10:30:00Z)>"
updated_at: "<ISO 8601 timestamp (e.g., 2026-05-13T10:30:00Z)>"
proposal: "../.proposals/<timestamp>-<proposal-slug>.md"  # planning requires an accepted proposal
state_dir: "../.state/<plan-slug>/"
active_step: null  # or step ID like "01-example-step"

objective: |
  <Clear statement of what this plan intends to accomplish>

proposal_summary: |
  <Brief summary of the accepted proposal this plan implements>

inputs:
  - "<List of input resources or file paths>"
  - "../.proposals/<timestamp>-<proposal-slug>.md"

constraints:
  - "<List of constraints affecting the plan execution>"
  - "<Each constraint as a separate string>"

execution_strategy: |
  <High-level description of the execution approach>

delegation_map:
  <role-name>: "<worker-family>-<size>"  # e.g., "analysis-lg"
  example_role: "generic-sm"

steps:
  - id: "01-example-step"
    depends_on: []
    parallel_group: "A"
    worker:
      family: generic  # One of: generic, analysis, coding, doc-writer, websearch, multimodal-looker
      size: sm         # One of: xs, sm, md, lg, xl
    skill: null        # null or lowercase-hyphenated skill name (e.g., lesson-writer)
    minimum_capable_tier: sm
    context_package:
      user_requirement_slice: "<Slice of user requirements relevant to this step>"
      relevant_proposal_sections:
        - "<Relevant sections from the proposal>"
      relevant_state_files: []
      files_in_scope:
        - "<Files this step may read or edit>"
      files_out_scope:
        - "<Files this step must not touch>"
      expected_return_format: "<Expected format of the output>"
    objective: "<Bounded objective for this step>"
    expected_output: "<What this step should produce>"
    state_updates:
      - "../.state/<plan-slug>/01-example-step.md"
    acceptance_criteria:
      - "<Criterion one>"
      - "<Criterion two>"
    verification: "<How to verify this step>"
    recovery: "<What to do if this step fails>"

  - id: "02-another-step"
    depends_on:
      - "01-example-step"
    parallel_group: "B"
    worker:
      family: analysis
      size: md
    skill: null
    minimum_capable_tier: sm
    context_package:
      user_requirement_slice: "<Slice of user requirements relevant to this step>"
      relevant_proposal_sections:
        - "<Relevant sections from the proposal>"
      relevant_state_files:
        - "../.state/<plan-slug>/01-example-step.md"
      files_in_scope:
        - "<Files this step may read or edit>"
      files_out_scope:
        - "<Files this step must not touch>"
      expected_return_format: "<Expected format of the output>"
    objective: "<Bounded objective for this step>"
    expected_output: "<What this step should produce>"
    state_updates:
      - "../.state/<plan-slug>/02-another-step.md"
    acceptance_criteria:
      - "<Criterion one>"
      - "<Criterion two>"
    verification: "<How to verify this step>"
    recovery: "<What to do if this step fails>"

dependency_graph:
  01-example-step: []
  02-another-step: ["01-example-step"]

parallel_groups:
  A: ["01-example-step"]
  B: ["02-another-step"]

state_initialization:
  metadata_schema_version: 2
  require_step_files: true
  step_file_extension: ".md"
  main_dashboard: "MAIN.md"

verification_gates:
  - gate: "<Descriptive gate name>"
    criteria:
      - "<Criterion one>"
      - "<Criterion two>"
  - gate: "<Another gate name>"
    criteria:
      - "<Criterion one>"
      - "<Criterion two>"

embedded_quality_check:
  performed_by: null  # Worker who performed the quality check
  findings: null      # Array of findings or null
  status: pending     # One of: pending, passed, failed

rollback_recovery: |
  <Steps to undo or recover from execution>

final_report_contract: |
  <What the final report must include>

# --- Optional planning-analysis and handoff-traceability fields ---
# These fields document how the plan was derived from the proposal.
# They are optional (not schema-required). See SKILL.md for guidance.
planning_analysis:
  proposal_fidelity: "<How this plan preserves the accepted proposal contract>"
  problem_breakdown: "<Breakdown of the problem into distinct workstreams>"
  workstreams:
    - "<workstream-1>"
    - "<workstream-2>"
  skill_mapping: "<Map of workstreams to skills>"
  dependency_analysis: "<How step dependencies were derived>"
  parallelization_analysis: "<How parallel groups were determined>"
  state_and_artifact_impact: "<Files, state, and artifacts affected>"
  delegation_packet_inventory: "<List of packets needed>"

handoff_traceability:
  "<proposal acceptance criterion 1>": "<corresponding plan gate or step>"
  "<proposal acceptance criterion 2>": "<corresponding plan gate or step>"