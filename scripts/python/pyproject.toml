[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scripts-python"
version = "0.1.0"
description = "Python automation scripts for OpenCode skills"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "click>=8.4.2",
    "jsonschema>=4.0",
    "lxml>=6.1.0",
]

[project.scripts]
collect-skills = "cli.collect_skills:main"
example = "cli.example:main"
generate-uuids = "cli.generate_uuids:main"
resolve-script-root = "cli.resolve_script_root:main"
skill-validator = "cli.skill_validator:cli"
validate-and-format-output = "cli.validate_and_format_output:main"
validate-skill-meta = "cli.validate_skill_meta:main"
validate-task-structure = "cli.validate_task_structure:main"

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cli", "src/lib", "src/lib/shared"]

[tool.uv]
package = true

[tool.coverage.run]
source = ["cli", "lib"]
omit = ["*/tests/*", "*/test_*", "*/.tox/*", "*/venv/*", "*/env/*"]

[tool.coverage.report]
fail_under = 100

[tool.pytest.ini_options]
addopts = "--cov=cli --cov=lib --cov-report=term-missing --cov-fail-under=100"