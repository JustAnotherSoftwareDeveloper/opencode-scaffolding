[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scripts-python"
version = "0.1.0"
description = "Python automation scripts for OpenCode skills"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "click>=8.4.2",
    "jsonschema>=4.0",
    "lxml>=6.1.0",
]

[project.scripts]
collect-skills = "cli.collect_skills:main"
evaluate-semantic-selection = "cli.evaluate_semantic_selection:main"
example = "cli.example:main"
generate-task-json = "cli.generate_task_json:main"
render-task-markdown = "cli.render_task_markdown:main"
resolve-script-root = "cli.resolve_script_root:main"
skill-validator = "cli.skill_validator:cli"
validate-skill-md = "cli.validate_skill_md:main"
validate-skill-meta = "cli.validate_skill_meta:main"
validate-task-structure = "cli.validate_task_structure:main"

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cli", "src/lib"]
include = ["src/lib/generate_task_json/assets/task-packet.schema.json"]

[tool.uv]
package = true

[tool.coverage.run]
source = ["cli", "lib"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/.tox/*",
    "*/venv/*",
    "*/env/*",
    "*/agent_eval_suite/*",
]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.pytest.ini_options]
addopts = "--cov=cli --cov=lib --cov-report=term-missing --cov-fail-under=85"
markers = [
    "skip_coverage: Skip coverage checks for this test",
]
