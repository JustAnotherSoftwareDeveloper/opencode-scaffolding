[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scripts-python"
version = "0.1.0"
description = "Python automation scripts for OpenCode skills"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.0",
    "lxml>=6.1.0",
]

[project.scripts]
collect-skills = "collect_skills:main"

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=8.0",
    "ruff>=0.15.17",
]

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["collect_skills"]

[tool.setuptools.packages.find]
where = ["src", "lib"]
exclude = ["collect_skills"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["src", "tests"]
