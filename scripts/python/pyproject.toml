[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scripts-python"
version = "0.1.0"
description = "Python automation scripts for OpenCode skills"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.0",
    "lxml>=6.1.0",
]

[project.scripts]
collect-skills = "cli.collect_skills:main"

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=8.0",
    "ruff>=0.15.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cli", "src/lib"]

[tool.uv]
package = true
